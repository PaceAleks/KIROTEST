<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What Should I Do? — Activity Suggester</title>
  <link rel="preconnect" href="https://bored-api.appbrewery.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>What should I do?</h1>
      <p class="subtitle">Beat boredom with a fresh activity idea.</p>
    </header>

    <section class="controls" aria-label="Filters">
      <div class="field">
        <label for="type">Category</label>
        <select id="type">
          <option value="">Any category</option>
          <option value="education">Education</option>
          <option value="recreational">Recreational</option>
          <option value="social">Social</option>
          <option value="diy">DIY</option>
          <option value="charity">Charity</option>
          <option value="cooking">Cooking</option>
          <option value="relaxation">Relaxation</option>
          <option value="music">Music</option>
          <option value="busywork">Busywork</option>
        </select>
      </div>

      <div class="field">
        <label for="participants">Participants</label>
        <select id="participants">
          <option value="">Any number</option>
          <option value="1">Just me (1)</option>
          <option value="2">Two of us (2)</option>
          <option value="3">A few (3)</option>
          <option value="4">A group (4)</option>
        </select>
      </div>

      <div class="field">
        <label for="price">Max budget</label>
        <select id="price">
          <option value="">Any budget</option>
          <option value="0">Free</option>
          <option value="0.3">Cheap</option>
          <option value="0.6">Moderate</option>
          <option value="1">Any price</option>
        </select>
      </div>
    </section>

    <div class="actions">
      <button id="suggest" class="btn-primary" type="button">Suggest an activity</button>
    </div>

    <section id="result" class="result" aria-live="polite"></section>

    <section class="history" id="history-wrap" hidden>
      <h2>Recent suggestions</h2>
      <ul id="history"></ul>
    </section>

    <footer class="footer">
      Activities from
      <a href="https://bored-api.appbrewery.com" target="_blank" rel="noopener">bored-api.appbrewery.com</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
